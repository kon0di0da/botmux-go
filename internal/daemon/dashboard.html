<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>botmux-go Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
  --fg: #c9d1d9; --fg2: #8b949e; --green: #3fb950; --yellow: #d29922; --red: #f85149;
  --blue: #58a6ff; --purple: #bc8cff; --accent: #58a6ff;
}
html, body { height: 100%; font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace; font-size: 13px; background: var(--bg); color: var(--fg); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

.topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); height: 40px; flex-shrink: 0; }
.topbar .title { font-weight: bold; font-size: 14px; color: var(--green); }
.topbar .title span { color: var(--fg2); font-weight: normal; margin-left: 8px; font-size: 12px; }
.topbar .stats { display: flex; gap: 16px; font-size: 12px; color: var(--fg2); }
.topbar .stats b { color: var(--fg); }
.topbar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.dot-green { background: var(--green); }
.dot-yellow { background: var(--yellow); }
.dot-red { background: var(--red); }

.nav { display: flex; gap: 0; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 16px; flex-shrink: 0; }
.nav a { padding: 8px 16px; color: var(--fg2); font-size: 12px; border-bottom: 2px solid transparent; cursor: pointer; }
.nav a:hover { color: var(--fg); text-decoration: none; }
.nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

.main { flex: 1; overflow: auto; padding: 16px; }
.wrap { display: flex; flex-direction: column; height: 100vh; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; }
.card .label { font-size: 11px; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.card .value { font-size: 22px; font-weight: bold; }
.card .value.green { color: var(--green); }
.card .value.yellow { color: var(--yellow); }

.btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border: 1px solid var(--border); background: var(--bg3); color: var(--fg); border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-primary:hover { background: #4493e6; }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn-danger:hover { background: #da3633; }
.btn-sm { padding: 2px 8px; font-size: 11px; }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 6px 10px; background: var(--bg2); color: var(--fg2); font-weight: normal; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
tr:hover td { background: var(--bg2); }
.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; }
.badge-ready { background: rgba(63,185,80,0.15); color: var(--green); }
.badge-created, .badge-spawning { background: rgba(210,153,34,0.15); color: var(--yellow); }
.badge-recovering { background: rgba(188,140,255,0.15); color: var(--purple); }
.badge-closed { background: rgba(248,81,73,0.15); color: var(--red); }

.session-layout { display: flex; height: calc(100vh - 84px); gap: 0; }
.session-list { width: 260px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg2); flex-shrink: 0; }
.session-list .item { padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12px; }
.session-list .item:hover { background: var(--bg3); }
.session-list .item.active { background: var(--bg3); border-left: 2px solid var(--accent); }
.session-list .item .sid { font-weight: bold; margin-bottom: 2px; }
.session-list .item .meta { font-size: 11px; color: var(--fg2); }
.session-list .item .meta .sids { color: var(--green); }
.session-list .empty { padding: 20px; color: var(--fg2); text-align: center; font-size: 12px; }

.session-chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.chat-header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.chat-header .info { display: flex; align-items: center; gap: 10px; }
.chat-header .info .sid { font-weight: bold; font-size: 14px; }
.chat-header .actions { display: flex; gap: 6px; }

.chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; }
.chat-line { padding: 2px 0; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
.chat-line .time { color: var(--fg2); margin-right: 8px; font-size: 11px; }
.chat-line.user b { color: var(--blue); }
.chat-line.bot b { color: var(--green); }
.chat-line.system b { color: var(--yellow); }

.chat-input { padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg2); display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.chat-input textarea { flex: 1; min-height: 64px; max-height: 180px; resize: vertical; background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 8px 10px; border-radius: 4px; font-family: inherit; font-size: 12px; line-height: 1.4; outline: none; }
.chat-input textarea:focus { border-color: var(--accent); }
.chat-input textarea:disabled { opacity: 0.5; }
.btn-icon { width: 30px; height: 30px; justify-content: center; padding: 0; }

.form { max-width: 480px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; color: var(--fg2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 8px 10px; border-radius: 4px; font-family: inherit; font-size: 13px; outline: none; }
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-group .hint { font-size: 11px; color: var(--fg2); margin-top: 4px; }

.toast { position: fixed; top: 50px; right: 16px; padding: 10px 16px; border-radius: 4px; font-size: 12px; z-index: 1000; animation: slideIn 0.2s ease; max-width: 400px; word-break: break-all; }
.toast-error { background: var(--red); color: #fff; }
.toast-success { background: var(--green); color: #fff; }
.toast-info { background: var(--blue); color: #fff; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.welcome { text-align: center; padding: 60px 20px; color: var(--fg2); }
.welcome h2 { color: var(--fg); margin-bottom: 8px; }
.welcome p { margin-bottom: 4px; font-size: 12px; }
.welcome code { background: var(--bg3); padding: 2px 6px; border-radius: 3px; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">botmux-go <span id="version">v4</span></div>
    <div class="stats">
      <span><span class="dot dot-green" id="dot"></span><span id="conn-status">connecting...</span></span>
      <span>sessions: <b id="stat-sessions">0</b></span>
      <span>workers: <b id="stat-workers">0</b></span>
      <span>bots: <b id="stat-bots">0</b></span>
      <span id="uptime" style="color:var(--fg2)"></span>
    </div>
  </div>
  <div class="nav" id="nav">
    <a href="#/" data-route="/">Sessions</a>
    <a href="#/new" data-route="/new">+ New Session</a>
    <a href="#/bots" data-route="/bots">Bots</a>
  </div>
  <div class="main" id="app"></div>
</div>
<div id="toast-container"></div>

<script>
const API = '';
let healthData = null;
let sessionsData = { items: [] };
let botsData = { bots: [] };
let codexProfilesData = { profiles: [] };
let currentSessionId = null;
let pollTimer = null;
let chatPollTimer = null;
let lastOutputCount = 0;

function toast(msg, type) {
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(function() { el.remove(); }, 4000);
}

async function api(path, opts) {
  opts = opts || {};
  var url = API + path;
  var fetchOpts = { method: opts.method || 'GET', headers: {} };
  if (opts.body) {
    fetchOpts.headers['Content-Type'] = 'application/json';
    fetchOpts.body = JSON.stringify(opts.body);
  }
  try {
    var resp = await fetch(url, fetchOpts);
    var text = await resp.text();
    var data;
    try { data = JSON.parse(text); } catch(e) { data = text; }
    if (!resp.ok) {
      var errMsg = (data && data.error) ? data.error : ('HTTP ' + resp.status);
      if (opts.silent) return { error: errMsg, status: resp.status };
      toast(errMsg, 'error');
      return { error: errMsg, status: resp.status };
    }
    return data;
  } catch(e) {
    if (!opts.silent) toast('Network error: ' + e.message, 'error');
    return { error: e.message };
  }
}

function statusBadge(status, closed) {
  if (closed || status === 'CLOSED') return '<span class="badge badge-closed">CLOSED</span>';
  if (status === 'READY') return '<span class="badge badge-ready">READY</span>';
  if (status === 'CREATED' || status === 'SPAWNING') return '<span class="badge badge-spawning">' + (status||'?') + '</span>';
  if (status === 'RECOVERING') return '<span class="badge badge-recovering">RECOVERING</span>';
  return '<span class="badge">' + (status||'?') + '</span>';
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escapeJSString(value) {
  return String(value)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\x22')
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n')
    .replace(/</g, '\\x3c')
    .replace(/>/g, '\\x3e')
    .replace(/&/g, '\\x26');
}

function fmtTime(s) {
  if (!s) return '';
  try { var d = new Date(s); return d.toLocaleTimeString(); } catch(e) { return s; }
}

function fmtUptime(startedAt) {
  if (!startedAt) return '';
  var sec = Math.floor((Date.now() - new Date(startedAt).getTime()) / 1000);
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return 'up ' + (h > 0 ? h + 'h ' : '') + m + 'm ' + s + 's';
}

async function refreshHealth() {
  var h = await api('/api/healthz', { silent: true });
  if (h && h.ok) {
    healthData = h;
    document.getElementById('version').textContent = h.version || 'v4';
    document.getElementById('stat-sessions').textContent = h.sessions_count;
    document.getElementById('stat-workers').textContent = h.workers_count;
    document.getElementById('stat-bots').textContent = h.bots_count;
    document.getElementById('dot').className = 'dot dot-green';
    document.getElementById('conn-status').textContent = 'connected';
    document.getElementById('uptime').textContent = fmtUptime(h.started_at);
  } else {
    document.getElementById('dot').className = 'dot dot-red';
    document.getElementById('conn-status').textContent = 'disconnected';
  }
}

async function refreshSessions() {
  var data = await api('/api/sessions?sort=last_active_desc&limit=100', { silent: true });
  if (data && data.items) {
    sessionsData = data;
  }
}

async function refreshBots() {
  var data = await api('/api/bots', { silent: true });
  if (data && data.bots) {
    botsData = data;
  }
}

async function refreshCodexProfiles() {
  var data = await api('/api/codex/profiles', { silent: true });
  if (data && data.profiles) {
    codexProfilesData = data;
  }
}

function renderHome() {
  var activeCount = sessionsData.items.filter(function(s) { return !s.closed; }).length;
  var closedCount = sessionsData.items.filter(function(s) { return s.closed; }).length;
  var html = '';
  html += '<div class="cards">';
  html += '<div class="card"><div class="label">Active Sessions</div><div class="value green">' + activeCount + '</div></div>';
  html += '<div class="card"><div class="label">Closed Sessions</div><div class="value">' + closedCount + '</div></div>';
  html += '<div class="card"><div class="label">Workers</div><div class="value yellow">' + (healthData ? healthData.workers_count : 0) + '</div></div>';
  html += '<div class="card"><div class="label">Bots</div><div class="value">' + (healthData ? healthData.bots_count : 0) + '</div></div>';
  html += '</div>';

  html += '<h3 style="margin-bottom:8px;font-size:13px;">Sessions</h3>';
  html += '<table><thead><tr><th>Session ID</th><th>Bot</th><th>Status</th><th>PID</th><th>Created</th><th>Last Active</th><th>Actions</th></tr></thead><tbody>';
  if (sessionsData.items.length === 0) {
    html += '<tr><td colspan="7" style="text-align:center;color:var(--fg2);padding:20px;">No sessions. <a href="#/new">Create one</a></td></tr>';
  } else {
    sessionsData.items.forEach(function(s) {
      html += '<tr>';
      html += '<td><a href="#/session/' + encodeURIComponent(s.session_id) + '">' + escapeHtml(s.session_id) + '</a></td>';
      html += '<td>' + escapeHtml(s.bot_id) + '</td>';
      html += '<td>' + statusBadge(s.status, s.closed) + '</td>';
      html += '<td>' + (s.pid || '-') + '</td>';
      html += '<td>' + fmtTime(s.created_at) + '</td>';
      html += '<td>' + fmtTime(s.last_active) + '</td>';
      html += '<td>';
      html += '<a href="#/session/' + encodeURIComponent(s.session_id) + '" class="btn btn-sm">Open</a> ';
      if (!s.closed) {
        html += '<button class="btn btn-sm btn-danger" onclick="closeSession(\'' + escapeJSString(s.session_id) + '\')">Close</button>';
      }
      html += '</td>';
      html += '</tr>';
    });
  }
  html += '</tbody></table>';
  document.getElementById('app').innerHTML = html;
}

function renderNew() {
  var botOptions = '<option value="">(default)</option>';
  botsData.bots.forEach(function(b) {
    botOptions += '<option value="' + escapeHtml(b.bot_id) + '">' + escapeHtml(b.name) + ' (' + escapeHtml(b.bot_id) + ')</option>';
  });
  var html = '<h3 style="margin-bottom:16px;font-size:14px;">New Session</h3>';
  html += '<div class="form">';
  html += '<div class="form-group"><label>Session ID</label><input type="text" id="new-sid" placeholder="auto-generated if empty"><div class="hint">Optional, will be auto-generated if not provided</div></div>';
  html += '<div class="form-group"><label>Bot</label><select id="new-bot">' + botOptions + '</select></div>';
  var profileOptions = '<option value="">(bot default)</option>';
  codexProfilesData.profiles.forEach(function(profile) {
    profileOptions += '<option value="' + escapeHtml(profile) + '">' + escapeHtml(profile) + '</option>';
  });
  html += '<div class="form-group"><label>Codex Profile</label><select id="new-codex-profile">' + profileOptions + '</select><div class="hint">Applied only when starting a new Codex session</div></div>';
  html += '<button class="btn btn-primary" onclick="createSession()">Create Session</button>';
  html += '</div>';
  document.getElementById('app').innerHTML = html;
  syncCodexProfileControl();
  document.getElementById('new-bot').addEventListener('change', syncCodexProfileControl);
}

function syncCodexProfileControl() {
  var botId = document.getElementById('new-bot').value;
  var bot = botsData.bots.find(function(item) { return item.bot_id === botId; });
  var enabled = !bot || bot.cli_type === 'codex';
  var select = document.getElementById('new-codex-profile');
  select.disabled = !enabled;
  if (!enabled) select.value = '';
}

function renderBots() {
  var html = '<h3 style="margin-bottom:12px;font-size:14px;">Bots (' + botsData.bots.length + ')</h3>';
  html += '<table><thead><tr><th>Name</th><th>Bot ID</th><th>CLI Type</th><th>Backend</th><th>Working Dir</th></tr></thead><tbody>';
  botsData.bots.forEach(function(b) {
    html += '<tr>';
    html += '<td>' + escapeHtml(b.name || '-') + '</td>';
    html += '<td><code>' + escapeHtml(b.bot_id) + '</code></td>';
    html += '<td>' + escapeHtml(b.cli_type || '-') + '</td>';
    html += '<td>' + escapeHtml(b.backend_type || '-') + '</td>';
    html += '<td>' + escapeHtml(b.working_dir || '-') + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('app').innerHTML = html;
}

var chatSessionData = null;
var renderedSessionId = null;
var lastOutputLen = 0;

async function loadChatSession(sid) {
  var detail = await api('/api/sessions/' + encodeURIComponent(sid) + '?limit=2000');
  if (detail && !detail.error) {
    chatSessionData = detail;
  }
}

function parseChatLine(line) {
  var label = 'bot', text = line;
  if (line.indexOf('[user] ') === 0) { label = 'user'; text = line.substring(7); }
  else if (line.indexOf('[system] ') === 0) { label = 'system'; text = line.substring(9); }
  else if (line.indexOf('[daemon] ') === 0) { label = 'system'; text = line.substring(9); }
  else if (line.indexOf('[mock-echo] ') === 0) { label = 'bot'; text = line.substring(12); }
  return { label: label, text: text };
}

function buildMessagesHtml(s) {
  var outputs = (s && s.outputs) ? s.outputs : [];
  if (outputs.length === 0) {
    return '<div class="chat-line system" style="color:var(--fg2);text-align:center;padding:20px;">No output yet. Send a message below.</div>';
  }
  var labelMap = { user: 'YOU', bot: 'BOT', system: 'SYS' };
  var baseOffset = (s && typeof s.offset === 'number') ? s.offset : 0;
  return outputs.map(function(line, i) {
    var p = parseChatLine(line);
    return '<div class="chat-line ' + p.label + '"><span class="time">[' + (baseOffset + i + 1) + ']</span><b>' + labelMap[p.label] + ' </b>' + escapeHtml(p.text) + '</div>';
  }).join('');
}

function buildSidebarHtml(activeSid) {
  if (sessionsData.items.length === 0) {
    return '<div class="empty">No sessions</div>';
  }
  return sessionsData.items.map(function(item) {
    var active = item.session_id === activeSid ? 'active' : '';
    var sd = item.closed ? '<span style="color:var(--red)">CLOSED</span>' : '<span class="sids">' + (item.status||'?') + '</span>';
    return '<div class="item ' + active + '" data-sid="' + escapeHtml(item.session_id) + '" onclick="location.hash=\'#/session/' + encodeURIComponent(item.session_id) + '\'">' +
      '<div class="sid">' + escapeHtml(item.session_id) + '</div>' +
      '<div class="meta">' + sd + ' | ' + escapeHtml(item.bot_id) + '</div>' +
      '</div>';
  }).join('');
}

function updateChatHeader(sid, s) {
  var header = document.querySelector('.chat-header .info');
  if (!header) return;
  var badge = s ? statusBadge(s.status, s.closed) : '';
  var pid = (s && s.pid) ? '<span style="color:var(--fg2);font-size:12px;">pid: ' + s.pid + '</span>' : '';
  var bot = s ? '<span style="color:var(--fg2);font-size:12px;">bot: ' + escapeHtml(s.bot_id) + '</span>' : '';
  var total = (s && typeof s.total_lines === 'number') ? s.total_lines : 0;
  var shown = (s && s.outputs) ? s.outputs.length : 0;
  var from = (s && typeof s.offset === 'number') ? s.offset + 1 : 1;
  var to = from + shown - 1;
  if (shown === 0) { from = 0; to = 0; }
  var linesInfo = '<span style="color:var(--fg2);font-size:12px;">lines: ' + from + '-' + to + ' / ' + total + '</span>';
  header.innerHTML = '<span class="sid">' + escapeHtml(sid) + '</span>' + badge + pid + bot + linesInfo;
}

function updateChatMessages(s) {
  var msgDiv = document.getElementById('chat-messages');
  if (!msgDiv) return;
  var outputs = (s && s.outputs) ? s.outputs : [];
  if (outputs.length !== lastOutputLen) {
    msgDiv.innerHTML = buildMessagesHtml(s);
    msgDiv.scrollTop = msgDiv.scrollHeight;
    lastOutputLen = outputs.length;
  }
}

function updateChatSidebar(activeSid) {
  var list = document.querySelector('.session-list');
  if (!list) return;
  list.innerHTML = buildSidebarHtml(activeSid);
}

function composerDisabled(s) {
  return !s || s.closed || s.turn_active || s.turn_cancelling;
}

function updateChatControls(s) {
  var input = document.getElementById('chat-input');
  var send = document.getElementById('chat-send-btn');
  var cancel = document.getElementById('chat-cancel-btn');
  var disabled = composerDisabled(s);
  var canCancel = !!(s && !s.closed && s.turn_active);
  var cancelling = !!(s && s.turn_cancelling);

  if (input) input.disabled = disabled;
  if (send) send.disabled = disabled;
  if (cancel) {
    cancel.hidden = !canCancel;
    cancel.disabled = cancelling;
    cancel.title = cancelling ? 'Cancelling turn...' : 'Cancel turn';
    cancel.setAttribute('aria-label', cancelling ? 'Cancelling turn' : 'Cancel turn');
  }
}

function handleComposerKey(event, sid) {
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
    event.preventDefault();
    sendMessage(sid);
  }
}

function renderChat(sid) {
  var s = chatSessionData;
  renderedSessionId = sid;
  lastOutputLen = (s && s.outputs) ? s.outputs.length : 0;

  var total = (s && typeof s.total_lines === 'number') ? s.total_lines : 0;
  var shown = (s && s.outputs) ? s.outputs.length : 0;
  var from = (s && typeof s.offset === 'number') ? s.offset + 1 : 1;
  var to = from + shown - 1;
  if (shown === 0) { from = 0; to = 0; }
  var linesInfo = '<span style="color:var(--fg2);font-size:12px;">lines: ' + from + '-' + to + ' / ' + total + '</span>';

  var html = '<div class="session-chat">';
  html += '<div class="chat-header">';
  html += '<div class="info">';
  html += '<span class="sid">' + escapeHtml(sid) + '</span>';
  if (s) html += statusBadge(s.status, s.closed);
  if (s && s.pid) html += '<span style="color:var(--fg2);font-size:12px;">pid: ' + s.pid + '</span>';
  if (s) html += '<span style="color:var(--fg2);font-size:12px;">bot: ' + escapeHtml(s.bot_id) + '</span>';
  if (s) html += linesInfo;
  html += '</div>';
  html += '<div class="actions">';
  html += '<a href="/api/sessions/' + encodeURIComponent(sid) + '/history?format=txt" class="btn btn-sm" download>Download .txt</a> ';
  if (s && !s.closed) {
    html += '<button class="btn btn-sm btn-danger" onclick="closeSessionFromChat(\'' + escapeJSString(sid) + '\')">Close</button>';
  }
  html += '</div></div>';

  html += '<div class="chat-messages" id="chat-messages">';
  html += buildMessagesHtml(s);
  html += '</div>';

  var disabled = composerDisabled(s);
  var disabledAttr = disabled ? 'disabled' : '';
  html += '<div class="chat-input">';
  html += '<textarea id="chat-input" rows="3" placeholder="Type a message..." ' + disabledAttr + ' onkeydown="handleComposerKey(event, \'' + escapeJSString(sid) + '\')" autofocus></textarea>';
  if (s && !s.closed) {
    html += '<button class="btn btn-icon" id="chat-cancel-btn" onclick="cancelTurn(\'' + escapeJSString(sid) + '\')" hidden title="Cancel turn" aria-label="Cancel turn">&#9632;</button>';
  }
  html += '<button class="btn btn-primary" id="chat-send-btn" onclick="sendMessage(\'' + escapeJSString(sid) + '\')" ' + disabledAttr + '>Send</button>';
  html += '</div></div>';

  var listHtml = '<div class="session-list" id="session-sidebar">';
  listHtml += buildSidebarHtml(sid);
  listHtml += '</div>';

  document.getElementById('app').innerHTML = '<div class="session-layout">' + listHtml + html + '</div>';

  var msgDiv = document.getElementById('chat-messages');
  if (msgDiv) msgDiv.scrollTop = msgDiv.scrollHeight;
  updateChatControls(s);
  var input = document.getElementById('chat-input');
  if (input && !disabled) input.focus();
}

async function createSession() {
  var sid = document.getElementById('new-sid').value.trim();
  var botId = document.getElementById('new-bot').value;
  var codexProfile = document.getElementById('new-codex-profile').value;
  var body = {};
  if (sid) body.session_id = sid;
  if (botId) body.bot_id = botId;
  if (codexProfile) body.codex_profile = codexProfile;
  var resp = await api('/api/sessions', { method: 'POST', body: body });
  if (resp && resp.ok) {
    toast('Session ' + resp.session_id + ' created (' + resp.status + ')', 'success');
    await refreshSessions();
    location.hash = '#/session/' + encodeURIComponent(resp.session_id);
  }
}

async function sendMessage(sid) {
  var input = document.getElementById('chat-input');
  var btn = document.getElementById('chat-send-btn');
  if (!input || composerDisabled(chatSessionData)) return;
  var msg = input.value;
  if (!msg.trim()) return;
  input.disabled = true;
  if (btn) btn.disabled = true;
  var resp = await api('/api/sessions/' + encodeURIComponent(sid) + '/send', { method: 'POST', body: { message: msg } });
  if (resp && resp.ok) {
    input.value = '';
    chatSessionData = Object.assign({}, chatSessionData || {}, { turn_active: true, turn_cancelling: false });
    updateChatControls(chatSessionData);
    await new Promise(function(r) { setTimeout(r, 600); });
    await loadChatSession(sid);
    updateChatMessages(chatSessionData);
    updateChatHeader(sid, chatSessionData);
    updateChatSidebar(sid);
    updateChatControls(chatSessionData);
  } else {
    updateChatControls(chatSessionData);
    input.focus();
  }
}

async function cancelTurn(sid) {
  var btn = document.getElementById('chat-cancel-btn');
  var s = chatSessionData;
  if (!btn || btn.disabled || !s || s.closed || !s.turn_active || s.turn_cancelling) return;

  btn.disabled = true;
  btn.title = 'Cancelling turn...';
  btn.setAttribute('aria-label', 'Cancelling turn');
  var resp = await api('/api/sessions/' + encodeURIComponent(sid) + '/cancel', { method: 'POST' });
  if (resp && resp.ok) {
    chatSessionData = Object.assign({}, s, { turn_active: true, turn_cancelling: true });
    updateChatControls(chatSessionData);
    toast('Turn cancellation requested', 'info');
    await loadChatSession(sid);
    updateChatMessages(chatSessionData);
    updateChatHeader(sid, chatSessionData);
    updateChatSidebar(sid);
    updateChatControls(chatSessionData);
  } else {
    updateChatControls(chatSessionData);
  }
}

async function closeSession(sid) {
  if (!confirm('Close session ' + sid + '?')) return;
  var resp = await api('/api/sessions/' + encodeURIComponent(sid) + '?reason=dashboard', { method: 'DELETE' });
  if (resp && resp.ok) {
    toast('Session ' + sid + ' closed', 'success');
    await refreshSessions();
    renderHome();
  }
}

async function closeSessionFromChat(sid) {
  if (!confirm('Close session ' + sid + '?')) return;
  await api('/api/sessions/' + encodeURIComponent(sid) + '?reason=dashboard', { method: 'DELETE' });
  toast('Session ' + sid + ' closing...', 'info');
  setTimeout(function() { location.hash = '#/'; }, 1500);
}

function setActiveNav(route) {
  document.querySelectorAll('.nav a').forEach(function(a) {
    a.classList.toggle('active', a.getAttribute('data-route') === route);
  });
}

var currentRoute = '';

function resolveRoute() {
  var hash = location.hash || '#/';
  if (hash.indexOf('#/session/') === 0) {
    return { name: 'chat', sid: decodeURIComponent(hash.substring('#/session/'.length)) };
  }
  if (hash === '#/new') return { name: 'new' };
  if (hash === '#/bots') return { name: 'bots' };
  return { name: 'home' };
}

async function fullRender() {
  var route = resolveRoute();
  currentRoute = route.name;
  renderedSessionId = null;
  if (route.name === 'home') {
    setActiveNav('/');
    renderHome();
  } else if (route.name === 'new') {
    setActiveNav('/new');
    renderNew();
  } else if (route.name === 'bots') {
    setActiveNav('/bots');
    renderBots();
  } else if (route.name === 'chat') {
    setActiveNav('/');
    currentSessionId = route.sid;
    await loadChatSession(route.sid);
    renderChat(route.sid);
  }
}

async function poll() {
  await refreshHealth();
  await refreshSessions();
  await refreshBots();
  await refreshCodexProfiles();
  updateTopbar();
  var route = resolveRoute();
  if (route.name !== currentRoute || (route.name === 'chat' && route.sid !== renderedSessionId)) {
    await fullRender();
    return;
  }
  if (route.name === 'home') {
    updateHomeStats();
    updateHomeTable();
  } else if (route.name === 'chat') {
    var sid = route.sid;
    currentSessionId = sid;
    await loadChatSession(sid);
    updateChatHeader(sid, chatSessionData);
    updateChatMessages(chatSessionData);
    updateChatSidebar(sid);
    updateChatControls(chatSessionData);
  }
}

function updateTopbar() {
  var dot = document.getElementById('dot');
  var conn = document.getElementById('conn-status');
  var sSess = document.getElementById('stat-sessions');
  var sWork = document.getElementById('stat-workers');
  var sBots = document.getElementById('stat-bots');
  var up = document.getElementById('uptime');
  var ver = document.getElementById('version');
  if (healthData && healthData.ok) {
    if (dot) dot.className = 'dot dot-green';
    if (conn) conn.textContent = 'connected';
    if (sSess) sSess.textContent = healthData.sessions_count;
    if (sWork) sWork.textContent = healthData.workers_count;
    if (sBots) sBots.textContent = healthData.bots_count;
    if (ver) ver.textContent = healthData.version || 'v4';
    if (up) up.textContent = fmtUptime(healthData.started_at);
  } else {
    if (dot) dot.className = 'dot dot-red';
    if (conn) conn.textContent = 'disconnected';
  }
}

function updateHomeStats() {
  var active = sessionsData.items.filter(function(s) { return !s.closed; }).length;
  var closed = sessionsData.items.filter(function(s) { return s.closed; }).length;
  var cards = document.querySelectorAll('.card .value');
  if (cards.length >= 4) {
    cards[0].textContent = active;
    cards[1].textContent = closed;
    cards[2].textContent = healthData ? healthData.workers_count : 0;
    cards[3].textContent = healthData ? healthData.bots_count : 0;
  }
}

function updateHomeTable() {
  var tbody = document.querySelector('table tbody');
  if (!tbody) return;
  var html = '';
  if (sessionsData.items.length === 0) {
    html = '<tr><td colspan="7" style="text-align:center;color:var(--fg2);padding:20px;">No sessions. <a href="#/new">Create one</a></td></tr>';
  } else {
    sessionsData.items.forEach(function(s) {
      html += '<tr>';
      html += '<td><a href="#/session/' + encodeURIComponent(s.session_id) + '">' + escapeHtml(s.session_id) + '</a></td>';
      html += '<td>' + escapeHtml(s.bot_id) + '</td>';
      html += '<td>' + statusBadge(s.status, s.closed) + '</td>';
      html += '<td>' + (s.pid || '-') + '</td>';
      html += '<td>' + fmtTime(s.created_at) + '</td>';
      html += '<td>' + fmtTime(s.last_active) + '</td>';
      html += '<td>';
      html += '<a href="#/session/' + encodeURIComponent(s.session_id) + '" class="btn btn-sm">Open</a> ';
      if (!s.closed) {
        html += '<button class="btn btn-sm btn-danger" onclick="closeSession(\'' + escapeJSString(s.session_id) + '\')">Close</button>';
      }
      html += '</td>';
      html += '</tr>';
    });
  }
  tbody.innerHTML = html;
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  Promise.all([refreshHealth(), refreshSessions(), refreshBots(), refreshCodexProfiles()]).then(function() {
    updateTopbar();
    fullRender();
  });
  pollTimer = setInterval(poll, 2000);
}

window.addEventListener('hashchange', fullRender);
startPolling();
</script>
</body>
</html>
